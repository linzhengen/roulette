<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React ルーレット</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-10">
                    <h1 class="title has-text-centered">React ルーレット</h1>
                    <div id="root"></div>
                </div>
            </div>
        </div>
    </section>

    <style>
        .roulette-container {
            padding: 1rem;
        }

        .option-item {
            transition: all 0.2s ease;
        }

        .option-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-list {
            max-height: 400px;
            overflow-y: auto;
        }

        /* モバイル対応 */
        @media (max-width: 768px) {
            .roulette-container {
                padding: 0.5rem;
            }

            canvas {
                max-width: 100%;
                height: auto;
            }
        }

        /* アニメーション */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-item {
            animation: fadeIn 0.3s ease;
        }

        .tag.is-success {
            animation: fadeIn 0.5s ease;
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Import the ReactRoulette component
        const ReactRoulette = () => {
            const canvasRef = useRef(null);
            const [newOptionName, setNewOptionName] = useState('');
            const [options, setOptions] = useState([]);
            const [gotOptions, setGotOptions] = useState([]);
            const [rouletteCore, setRouletteCore] = useState(null);
            const [optionColors, setOptionColors] = useState({});
            const [isSpinning, setIsSpinning] = useState(false);

            let optionIdCounter = 1;

            function generateColor(id) {
                const colors = [
                    '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
                    '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9'
                ];
                return colors[id % colors.length];
            }

            // Load from localStorage on component mount
            useEffect(() => {
                const savedOptions = localStorage.getItem('rouletteOptions');
                if (savedOptions) {
                    const parsedOptions = JSON.parse(savedOptions);
                    const processedOptions = parsedOptions.map(option => ({
                        ...option,
                        id: option.id || optionIdCounter++,
                        weight: option.weight || 1
                    }));
                    setOptions(processedOptions);
                }

                const savedWinners = localStorage.getItem('rouletteWinners');
                if (savedWinners) {
                    setGotOptions(JSON.parse(savedWinners));
                }
            }, []);

            // Save to localStorage whenever options or gotOptions change
            useEffect(() => {
                localStorage.setItem('rouletteOptions', JSON.stringify(options));
                localStorage.setItem('rouletteWinners', JSON.stringify(gotOptions));
            }, [options, gotOptions]);

            // Initialize roulette core when canvas is ready
            useEffect(() => {
                if (canvasRef.current) {
                    const core = new window.RouletteCore(canvasRef.current);
                    setRouletteCore(core);
                }
            }, []);

            // Update roulette when options change
            useEffect(() => {
                if (rouletteCore) {
                    rouletteCore.setOptions(options);
                }
            }, [options, rouletteCore]);

            const getOptionColor = (id) => {
                if (!optionColors[id]) {
                    const newColors = { ...optionColors, [id]: generateColor(id) };
                    setOptionColors(newColors);
                    return newColors[id];
                }
                return optionColors[id];
            };

            const addOption = () => {
                if (newOptionName.trim()) {
                    const newOption = {
                        id: optionIdCounter++,
                        name: newOptionName.trim(),
                        weight: 1
                    };
                    setOptions(prev => [...prev, newOption]);
                    setNewOptionName('');
                }
            };

            const removeOption = (id) => {
                setOptions(prev => prev.filter(option => option.id !== id));
            };

            const removeGotOption = (id) => {
                const optionToRestore = gotOptions.find(option => option.id === id);
                if (optionToRestore) {
                    // 候補に戻す
                    setOptions(prev => [...prev, optionToRestore]);
                    setGotOptions(prev => prev.filter(option => option.id !== id));
                }
            };

            const updateWeight = (id, newWeight) => {
                setOptions(prev =>
                    prev.map(option =>
                        option.id === id ? { ...option, weight: newWeight } : option
                    )
                );
            };

            const spin = () => {
                if (rouletteCore && options.length > 0) {
                    setIsSpinning(true);
                    rouletteCore.spin((result) => {
                        setGotOptions(prev => [...prev, result]);
                        setIsSpinning(false);
                        setTimeout(() => {
                            removeOption(result.id);
                        }, 2000);
                    });
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    addOption();
                }
            };

            return (
                <div>
                    <div className="notification is-info">
                        <p>React 18で実装されたルーレットアプリです。選択肢を追加してルーレットを回しましょう！</p>
                    </div>

                    {/* ヘッダーセクション */}
                    <div className="columns is-mobile is-centered mb-5">
                        <div className="column is-half-desktop is-full-mobile">
                            <div className="box has-background-light">
                                <div className="field has-addons">
                                    <div className="control is-expanded">
                                        <input
                                            value={newOptionName}
                                            onChange={(e) => setNewOptionName(e.target.value)}
                                            onKeyPress={handleKeyPress}
                                            className="input is-medium"
                                            type="text"
                                            placeholder="選択肢を追加..."
                                        />
                                    </div>
                                    <div className="control">
                                        <button className="button is-primary is-medium" onClick={addOption}>
                                            <span className="icon">
                                                <i className="fas fa-plus"></i>
                                            </span>
                                            <span>追加</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* メインコンテンツ */}
                    <div className="columns is-desktop">
                        {/* ルーレットセクション */}
                        <div className="column is-half-desktop is-full-mobile">
                            <div className="card">
                                <div className="card-content">
                                    <h2 className="title is-4 has-text-centered mb-4">ルーレット</h2>
                                    <div className="has-text-centered">
                                        <canvas ref={canvasRef} width="500" height="500" style={{maxWidth: '100%'}}></canvas>
                                    </div>
                                    <div className="has-text-centered mt-4">
                                        <button
                                            className="button is-danger is-large is-rounded"
                                            onClick={spin}
                                            disabled={options.length === 0 || isSpinning}
                                        >
                                            <span className="icon">
                                                <i className="fas fa-play"></i>
                                            </span>
                                            <span>スタート！</span>
                                        </button>
                                    </div>
                                    <div className="has-text-centered mt-2">
                                        <small className="has-text-grey">選択肢が{options.length}個あります</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 選択肢セクション */}
                        <div className="column is-half-desktop is-full-mobile">
                            {/* 候補リスト */}
                            {options.length > 0 && (
                                <div className="card mb-4">
                                    <div className="card-header">
                                        <p className="card-header-title">
                                            <span className="icon">
                                                <i className="fas fa-list"></i>
                                            </span>
                                            <span>候補リスト ({options.length})</span>
                                        </p>
                                    </div>
                                    <div className="card-content">
                                        <div className="content">
                                            <div className="option-list">
                                                {options.map((option) => (
                                                    <div
                                                        key={option.id}
                                                        className="option-item box is-flex is-align-items-center is-justify-content-space-between mb-2"
                                                        style={{ borderLeft: '4px solid ' + getOptionColor(option.id) }}
                                                    >
                                                        <div className="is-flex-grow-1">
                                                            <strong>{option.name}</strong>
                                                            <div className="field has-addons mt-1">
                                                                <div className="control">
                                                                    <span className="tag">重み</span>
                                                                </div>
                                                                <div className="control">
                                                                    <input
                                                                        value={option.weight}
                                                                        onChange={(e) => updateWeight(option.id, parseInt(e.target.value) || 1)}
                                                                        className="input is-small"
                                                                        type="number"
                                                                        min="1"
                                                                        max="100"
                                                                        style={{ width: '70px' }}
                                                                    />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button
                                                            className="button is-small is-danger is-outlined"
                                                            onClick={() => removeOption(option.id)}
                                                            title="削除"
                                                        >
                                                            <span className="icon">
                                                                <i className="fas fa-trash"></i>
                                                            </span>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 当選結果 */}
                            {gotOptions.length > 0 && (
                                <div className="card">
                                    <div className="card-header">
                                        <p className="card-header-title has-text-success">
                                            <span className="icon">
                                                <i className="fas fa-trophy"></i>
                                            </span>
                                            <span>当選結果 ({gotOptions.length})</span>
                                        </p>
                                    </div>
                                    <div className="card-content">
                                        <div className="content">
                                            <div className="tags are-medium">
                                                {gotOptions.map((option) => (
                                                    <div
                                                        key={option.id}
                                                        className="tag is-success is-light"
                                                    >
                                                        {option.name}
                                                        <button
                                                            className="delete is-small ml-2"
                                                            onClick={() => removeGotOption(option.id)}
                                                        ></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 空の状態 */}
                            {options.length === 0 && gotOptions.length === 0 && (
                                <div className="card">
                                    <div className="card-content has-text-centered">
                                        <div className="content">
                                            <span className="icon is-large has-text-grey-light mb-3">
                                                <i className="fas fa-list-ul fa-2x"></i>
                                            </span>
                                            <p className="has-text-grey">選択肢を追加してルーレットを回しましょう！</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => (
            <ReactRoulette />
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script src="../../components/roulette/RouletteCore.js"></script>
</body>
</html>
